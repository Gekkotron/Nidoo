# Nidoo sound satellite: Seeed Studio XIAO ESP32S3 + INMP441 microphone + PCM5102A DAC.
#
# Plays the music streamed by nidoo-sound (a Sendspin-compatible server), and
# listens after "Hey Jarvis": a short chime says so (nidoo_chime.h), and the
# microphone goes to the Nidoo hub, signed with the shared voice_key, only
# inside that window (see nidoo_voice.h and docs/reference/voice-protocol.md).
# Per-board values come from substitutions (override with --substitution or a
# per-board file under satellite/boards/) and from the git-ignored secrets.yaml.
#
# Pinned to ESPHome 2026.10.2: the Sendspin protocol version must match nidoo-sound.
#   uvx esphome==2026.10.2 run satellite.yaml

substitutions:
  name: nidoo-satellite
  friendly_name: Nidoo satellite
  # INMP441 microphone (its own I2S bus)
  mic_ws_pin: GPIO1
  mic_sck_pin: GPIO2
  mic_sd_pin: GPIO4
  # PCM5102A DAC (its own I2S bus)
  dac_bck_pin: GPIO7
  dac_lrck_pin: GPIO8
  dac_din_pin: GPIO9
  # The XIAO's user LED (lit while the satellite listens)
  led_pin: GPIO21
  # Speech input: this board's UDP port and the hub's shared key (Assistant →
  # Speech settings → Speech input on the hub, pasted into secrets.yaml)
  voice_board_port: "4961"
  voice_key: !secret voice_key

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.2
  includes:
    - nidoo_voice.h
    - nidoo_chime.h
  on_boot:
    priority: -100
    then:
      - lambda: nidoo_voice_setup("${voice_key}", ${voice_board_port});
      # The chime input is not fed by the media pipeline, so nothing tells it
      # its format: without this it is 16 kHz mono and the mixer rejects it
      # (or pins itself to 16 kHz). Same as the DAC: s16, stereo, 48 kHz.
      - lambda: |-
          id(chime_in).set_audio_stream_info(esphome::audio::AudioStreamInfo(16, 2, 48000));
          nidoo_chime_prepare();
      # Start the microphone once and never stop it: restarting the I2S mic
      # costs about a second of silence, the start of every command.
      - microphone.capture: mic
      - micro_wake_word.start:

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Keep every out-of-order TCP segment (0 = no limit, ESP-IDF's own default when
      # lwIP buffers live in PSRAM). `psram:` sets CONFIG_SPIRAM_IGNORE_NOTFOUND, which
      # drops the limit to 4: one lost Wi-Fi segment then costs a whole-window resend
      # and seconds of retransmit backoff, the music buffer runs dry and the board
      # logs "Lost sync". Measured: 24 losses in 5 min with 4, 2 tiny ones with 0.
      CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS: "0"

psram:
  mode: octal
  speed: 80MHz

logger:

# Uptime, free heap, largest free block and free PSRAM, logged once a minute
# as a `health:` line: watch it in `esphome logs` during soak tests (a steady
# decline means a leak, an uptime reset means the board rebooted).
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      id: heap_free
      name: Free heap
    block:
      id: heap_block
      name: Largest free block
    psram:
      id: psram_free
      name: Free PSRAM
  - platform: uptime
    id: uptime_s
    name: Uptime
    update_interval: 60s

interval:
  - interval: 60s
    then:
      - logger.log:
          level: INFO
          format: "health: uptime %.0f s, free heap %.0f B, largest block %.0f B, free PSRAM %.0f B"
          args:
            - id(uptime_s).state
            - id(heap_free).state
            - id(heap_block).state
            - id(psram_free).state

  # Speech input: the hub's messages, and the window's end.
  - interval: 20ms
    then:
      - lambda: |-
          int got = nidoo_voice_poll();
          uint32_t now = millis();
          bool timed_out = id(voice_open) && (int32_t) (now - id(voice_until)) >= 0;
          if (id(voice_open) && (got == 2 || timed_out)) {
            // The hub heard the end of the phrase (Stop), or the window ran out.
            if (timed_out) nidoo_voice_end();
            id(voice_open) = false;
            id(led).turn_off().perform();
            id(voice_unmute_pending) = true;
            id(mww).start();
          } else if (!id(voice_open) && got == 3) {
            // The hub asks a question back: listen without the wake word. The
            // reply has finished playing; the room's music is still held.
            nidoo_voice_wake(1);
            id(voice_until) = now + 6000;
            id(voice_open) = true;
            id(led).turn_on().perform();
          }
          // Give the music back no earlier than 1 s after the wake word: the
          // music already sent ahead must not play over the command.
          if (id(voice_unmute_pending) && (int32_t) (now - id(voice_opened_at) - 1000) >= 0) {
            id(music_in).apply_ducking(0, 0);
            id(voice_unmute_pending) = false;
          }
          nidoo_chime_pump(id(chime_in));

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

mdns:

ota:
  - platform: esphome
    password: !secret ota_password

# The ESPHome native API (api:) comes with project 2, when the hub talks to the satellites.

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: ${mic_ws_pin}
    i2s_bclk_pin: ${mic_sck_pin}
  - id: i2s_dac
    i2s_lrclk_pin: ${dac_lrck_pin}
    i2s_bclk_pin: ${dac_bck_pin}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: ${mic_sd_pin}
    adc_type: external
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000
    on_data:
      - lambda: |-
          // Audio leaves the board only inside a window.
          if (id(voice_open)) nidoo_voice_audio(x);

speaker:
  - platform: i2s_audio
    id: dac
    i2s_audio_id: i2s_dac
    i2s_dout_pin: ${dac_din_pin}
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    num_channels: 2
    # The music is silenced, and the chime starts, behind what this buffer
    # already holds: 100 ms instead of the default 500 ms. Network hiccups are
    # absorbed further up, by the seconds nidoo-sound sends ahead.
    buffer_duration: 100ms
  # Music and the wake chime share the DAC.
  - platform: mixer
    id: dac_mixer
    output_speaker: dac
    task_stack_in_psram: true
    source_speakers:
      - id: music_in
      # Holds the whole 200 ms chime.
      - id: chime_in
        buffer_duration: 250ms

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true
  # No pairing code: nidoo-sound connects with the protocol's unpaired (Sentinel) key.
  unpaired_access: true

media_source:
  - platform: sendspin
    id: sendspin_source
    sample_rate: 48000
    codecs: [pcm]

media_player:
  - platform: speaker_source
    id: player
    name: Player
    media_pipeline:
      speaker: music_in
      format: NONE
      num_channels: 2
      sources:
        - sendspin_source

# ---- Speech input ----

globals:
  # A window is open: the microphone streams to the hub.
  - id: voice_open
    type: bool
    initial_value: "false"
  # When the window closes by itself (millis).
  - id: voice_until
    type: uint32_t
    initial_value: "0"
  # When the window opened.
  - id: voice_opened_at
    type: uint32_t
    initial_value: "0"
  # The music is silenced by the window and waits to be given back.
  - id: voice_unmute_pending
    type: bool
    initial_value: "false"

output:
  - platform: gpio
    id: led_out
    pin:
      number: ${led_pin}
      inverted: true

light:
  - platform: binary
    id: led
    output: led_out
    internal: true

script:
  # The hub never greeted this board (no hub, wrong key): say so, send nothing.
  - id: voice_refused
    mode: single
    then:
      - repeat:
          count: 2
          then:
            - light.turn_on: led
            - delay: 150ms
            - light.turn_off: led
            - delay: 150ms
      - micro_wake_word.start:

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    channels: 0
    # The INMP441 is quiet: without this most tries are missed.
    gain_factor: 4
  models:
    - model: hey_jarvis
      # The default 0.97 missed most tries in the spike.
      probability_cutoff: 0.85
  on_wake_word_detected:
    - if:
        condition:
          lambda: return !id(voice_open) && nidoo_voice_ready();
        then:
          - lambda: |-
              // Quiet at once, so the first words are clean; the hub then holds
              // the room's music. The music input only (173 dB and more is
              // silence), so the chime still plays; never the media player's
              // mute: it goes to nidoo-sound as the satellite's Mute, and a
              // muted satellite stays silent, chime included.
              id(music_in).apply_ducking(255, 0);
              id(voice_unmute_pending) = false;
              nidoo_chime_start();
              nidoo_voice_wake(0);
              id(voice_opened_at) = millis();
              id(voice_until) = millis() + 8000;
              id(voice_open) = true;
          - light.turn_on: led
          # micro_wake_word stops itself after a detection and lets go of the
          # microphone: take it back for the window.
          - delay: 100ms
          - microphone.capture: mic
        else:
          - script.execute: voice_refused

