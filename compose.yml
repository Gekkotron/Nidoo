# Nidoo single-host Docker Compose.
# See docs/users/install-on-linux.md for the full install.
#
# `docker compose up` starts four services:
#   init         one-shot: writes the Mosquitto and TimescaleDB credentials
#                into ./data the first time, then exits.
#   mosquitto    the MQTT broker, on port 1883.
#   timescaledb  the history database, on port 5432.
#   hub          Nidoo itself, on port 8081.
#
# Optional, only when named: `docker compose up -d --build sound` starts
# nidoo-sound, music for the sound satellites (PCM in on port 4953, HTTP API
# on 4954, players on 8927, see docs/users/sound.md). Its own image and the
# `sound` profile keep it out of a whole-stack `up --build` (tools/update.sh),
# so updating the hub never restarts the music.
#
# Already have a broker and a database? Start only the hub and point it at
# them from the setup wizard: `docker compose up -d hub`.
#
# `network_mode: host` makes `localhost` inside each container the host's
# localhost. Everything the stack writes lives under ./data.

x-nidoo-build: &nidoo-build
  context: .
  dockerfile: Dockerfile

services:
  init:
    build: *nidoo-build
    # Same tag as the hub, so a fresh `docker compose up` builds it once
    # instead of trying to pull it.
    image: nidoo:local
    command: ["init-bundled"]
    restart: "no"
    volumes:
      - ./data:/data

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: nidoo-mosquitto
    restart: unless-stopped
    network_mode: host
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    container_name: nidoo-timescaledb
    restart: unless-stopped
    network_mode: host
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: nidoo
      POSTGRES_DB: nidoo
    # The password file only exists when init created the bundled
    # credentials. Without it (a hub that already has its own database) the
    # image's entrypoint never sees POSTGRES_PASSWORD_FILE, which it would
    # reject for a missing file. "$$@" passes on the command, so an override
    # such as `command: postgres -c port=5433` still works.
    entrypoint:
      - sh
      - -c
      - |
        [ -f /run/nidoo-bundled/db-password ] && export POSTGRES_PASSWORD_FILE=/run/nidoo-bundled/db-password
        exec docker-entrypoint.sh "$$0" "$$@"
    command: ["postgres"]
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data
      - ./data/bundled:/run/nidoo-bundled:ro

  hub:
    build: *nidoo-build
    image: nidoo:local
    container_name: nidoo-hub
    restart: unless-stopped
    network_mode: host
    # Optional, git-ignored: any NIDOO_* override.
    env_file:
      - path: .env
        required: false
    volumes:
      # hub.json, settings-cache.json and the history live here. The push
      # key is stored in the database once uploaded in the wizard;
      # data/secrets/ exists only on upgraded installs.
      - ./data:/data

  sound:
    build:
      <<: *nidoo-build
      target: sound
    image: nidoo-sound:local
    container_name: nidoo-sound
    # Started only when named (`docker compose up -d sound`, which turns the
    # profile on) or with `--profile sound`.
    profiles: ["sound"]
    restart: unless-stopped
    network_mode: host
    # The broker and its login come from the hub's data/hub.json (mounted
    # below). Optional, git-ignored: NIDOO_SOUND_* overrides, e.g. its own
    # broker login.
    env_file:
      - path: .env
        required: false
    command: ["run"]
    volumes:
      # sound/identity.key and sound/players.json live here.
      - ./data:/data
