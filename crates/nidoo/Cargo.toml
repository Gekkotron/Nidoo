[package]
name = "nidoo"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["tts", "stt"]
tts = ["dep:ptts", "dep:xn"]
stt = ["dep:sherpa-onnx"]

[dependencies]
ptts = { version = "=0.6.0", default-features = false, features = ["hf"], optional = true }
xn = { version = "=0.2.13", optional = true }
# Speech input: Parakeet + Silero VAD (its build script downloads the prebuilt libraries).
sherpa-onnx = { version = "=2.0.1", optional = true }
if-addrs = "0.13"
anyhow.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["clock"] }
chrono-tz = "0.10"
clap.workspace = true
figment.workspace = true
futures-util.workspace = true
iana-time-zone = "0.1"
mime_guess.workspace = true
nidoo-api = { path = "../nidoo-api" }
nidoo-assist = { path = "../nidoo-assist", features = ["schemars"] }
nidoo-alarm = { path = "../nidoo-alarm", features = ["schemars"] }
nidoo-climate = { path = "../nidoo-climate", features = ["schemars"] }
nidoo-core = { path = "../nidoo-core", features = ["schemars"] }
nidoo-frigate = { path = "../nidoo-frigate" }
nidoo-push = { path = "../nidoo-push" }
nidoo-solcast = { path = "../nidoo-solcast" }
nidoo-watchdog = { path = "../nidoo-watchdog" }
rmcp.workspace = true
rumqttc.workspace = true
rust-embed.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["query"] }
base64 = "0.22"
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
nidoo-voice = { path = "../nidoo-voice" }
tar = "0.4"
bzip2 = "0.5"
bytes = "1"
sqlx.workspace = true
thiserror.workspace = true
url.workspace = true
percent-encoding = "2"
surge-ping.workspace = true
sysinfo.workspace = true
socket2 = "0.6"
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
figment = { workspace = true, features = ["test"] }
rmcp = { workspace = true, features = ["transport-child-process"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tempfile = "3"
toml = "0.8"
