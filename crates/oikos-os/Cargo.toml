[package]
name = "oikos-os"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
if-addrs = "0.13"
anyhow.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["clock"] }
chrono-tz = "0.10"
clap.workspace = true
figment.workspace = true
futures-util.workspace = true
iana-time-zone = "0.1"
mime_guess.workspace = true
oikos-api = { path = "../oikos-api" }
oikos-alarm = { path = "../oikos-alarm", features = ["schemars"] }
oikos-climate = { path = "../oikos-climate", features = ["schemars"] }
oikos-core = { path = "../oikos-core", features = ["schemars"] }
oikos-frigate = { path = "../oikos-frigate" }
oikos-push = { path = "../oikos-push" }
oikos-solcast = { path = "../oikos-solcast" }
oikos-watchdog = { path = "../oikos-watchdog" }
rmcp.workspace = true
rumqttc.workspace = true
rust-embed.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["query"] }
base64 = "0.22"
getrandom = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
bytes = "1"
sqlx.workspace = true
thiserror.workspace = true
url.workspace = true
percent-encoding = "2"
surge-ping.workspace = true
socket2 = "0.6"
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
figment = { workspace = true, features = ["test"] }
rmcp = { workspace = true, features = ["transport-child-process"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tempfile = "3"
toml = "0.8"
