[package]
name = "nidoo-web"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# The browser tests are one binary (tests/browser.rs) rather than one per file: each binary
# costs a wasm link and a Chrome start, which made the CI job take 15 minutes.
autotests = false

[lib]
path = "src/lib.rs"

[[test]]
name = "browser"
path = "tests/browser.rs"

[[test]]
name = "bare_text"
path = "tests/bare_text.rs"

[[bin]]
name = "nidoo-web"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
chrono-tz = "0.10"
console_error_panic_hook.workspace = true
futures-util.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
js-sys.workspace = true
leptos.workspace = true
leptos_router.workspace = true
nidoo-alarm = { path = "../nidoo-alarm" }
nidoo-api = { path = "../nidoo-api" }
nidoo-assist = { path = "../nidoo-assist" }
nidoo-climate = { path = "../nidoo-climate" }
nidoo-core = { path = "../nidoo-core" }
nidoo-frigate = { path = "../nidoo-frigate" }
serde.workspace = true
serde-wasm-bindgen.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Blob",
    "Document",
    "DomRect",
    "Clipboard",
    "Crypto",
    "CssStyleDeclaration",
    "DataTransfer",
    "File",
    "FileList",
    "HtmlInputElement",
    "DragEvent",
    "Element",
    "GainNode",
    "History",
    "HtmlDialogElement",
    "HtmlAudioElement",
    "HtmlDocument",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlMediaElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "OscillatorNode",
    "OscillatorType",
    "PointerEvent",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Url",
    "WheelEvent",
] }

[dev-dependencies]
web-sys = { workspace = true, features = ["Document", "Element", "SvgElement", "Event", "EventInit", "HtmlDialogElement", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "KeyboardEvent", "KeyboardEventInit", "History", "Node", "NodeList", "PointerEvent", "PointerEventInit", "DragEvent", "DragEventInit", "File", "FileList", "DataTransferItem", "DataTransferItemList", "DataTransfer"] }
wasm-bindgen-test.workspace = true
